{% load static %}
<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Путешествуем вместе{% endblock %} · Group Travel</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}">
    <script src="{% static 'homepage/js/main.js' %}" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#content">К содержимому</a>
    {% include "includes/navigation.html" %}
    <main id="content" class="container">{% block content %}{% endblock %}</main>
    <footer class="container">Group Travel · Планируем путешествия вместе · {% now "Y" %}</footer>
  </body>
</html>
